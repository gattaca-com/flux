name: release check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semver:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""

      - name: Test release tooling
        run: python3 .github/scripts/test_release.py

      - name: Validate release version
        id: release
        run: python3 .github/scripts/release.py --github-output "$GITHUB_OUTPUT"

      - name: Check public API compatibility
        if: steps.release.outputs.should_release == 'true' && steps.release.outputs.previous_tag != ''
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          baseline-rev: ${{ steps.release.outputs.previous_tag }}
          release-type: ${{ steps.release.outputs.release_type }}
