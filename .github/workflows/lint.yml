name: lint

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Overrides the `-D warnings` that setup-rust-toolchain sets by default; clippy
  # applies `-D warnings` itself via the justfile.
  RUSTFLAGS: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # No toolchain input, so the version comes from rust-toolchain.toml and lives in
      # exactly one place. Caching is built into this action.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""

      - name: Setup just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0
        with:
          just-version: 1.5.0

      - name: Check compilation
        run: cargo check --workspace --all-features --locked

      - name: Check formatting
        run: just fmt-check

      - name: Check clippy
        run: just clippy

      - name: Check unused dependencies
        run: just machete

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""

      # UDP tests size socket buffers to hold a full send window; the runner's
      # default caps them at 208 KB.
      - name: Allow large socket buffers
        run: sudo sysctl -w net.core.rmem_max=67108864 net.core.wmem_max=67108864

      - name: Run tests
        run: cargo test --workspace --all-features --locked
