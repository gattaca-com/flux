name: lint

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Overrides the `-D warnings` that setup-rust-toolchain sets by default; clippy
  # applies `-D warnings` itself via the justfile.
  RUSTFLAGS: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      # No toolchain input, so the version comes from rust-toolchain.toml and lives in
      # exactly one place. Caching is built into this action.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Setup just
        uses: extractions/setup-just@v2
        with:
          just-version: 1.5.0

      - name: Check compilation
        run: cargo check --workspace --all-features --locked

      - name: Check formatting
        run: just fmt-check

      - name: Check clippy
        run: just clippy

      - name: Check unused dependencies
        run: just machete

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      # Large-window UDP tests request 16 MiB; avoid silently capping their
      # socket buffers below the in-flight window. UDP has no receiver flow control.
      - name: Configure socket buffer limits
        run: sudo sysctl -w net.core.rmem_max=16777216 net.core.wmem_max=16777216

      - name: Run tests
        run: cargo test --workspace --all-features --locked
