name: release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - "crates/*/Cargo.toml"
  workflow_dispatch:

env:
  # Cancels the `target-cpu=native` from .cargo/config.toml: a cached build
  # script compiled on one runner's CPU can SIGILL on another.
  RUSTFLAGS: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""

      - name: Test release tooling
        run: python3 .github/scripts/test_release.py

      - name: Plan release
        id: release
        run: python3 .github/scripts/release.py --github-output "$GITHUB_OUTPUT"

      - name: Check workspace
        if: steps.release.outputs.should_release == 'true'
        run: cargo check --workspace --all-features --locked

      - name: Run tests
        if: steps.release.outputs.should_release == 'true'
        run: cargo test --workspace --all-features --locked

      - name: Check public API compatibility
        if: steps.release.outputs.should_release == 'true' && steps.release.outputs.previous_tag != ''
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          baseline-rev: ${{ steps.release.outputs.previous_tag }}
          release-type: ${{ steps.release.outputs.release_type }}

  tag:
    needs: validate
    if: needs.validate.outputs.should_release == 'true'
    # The organization IP allow list blocks tag pushes from GitHub-hosted runners.
    runs-on: [self-hosted, silver]
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ needs.validate.outputs.tag }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Tags the validated commit, even if main has moved on since.
      - name: Push release tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG is already released"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Release $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
