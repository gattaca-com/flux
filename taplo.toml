[formatting]
column_width = 120
compact_entries = false
reorder_arrays = true
reorder_inline_tables = true
reorder_keys = true

[[rule]]
include = [
    "**/config.example.static.toml",
    "**/config.example.toml",
    "**/config.static.toml",
    "**/config.toml",
]
[rule.formatting]
reorder_keys = false
