[package]
description = "Attribute macro `#[timed]` for the flux profiler."
edition.workspace = true
keywords = ["low-latency", "performance", "profiling"]
license.workspace = true
name = "flux-profiler-macros"
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
proc-macro = true

[dependencies]
quote.workspace = true
syn.workspace = true

[features]
# Compile `#[timed]` out to a no-op. Driven by `flux-profiler`'s `disable-profiling`.
disable-profiling = []

[lints]
workspace = true
