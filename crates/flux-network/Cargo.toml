[[bench]]
harness = false
name = "connector"

[[bench]]
harness = false
name = "udp_pipeline"

[[bench]]
harness = false
name = "http_client"

[[bench]]
harness = false
name = "http2"

[[bench]]
harness = false
name = "grpc"

[[bench]]
harness = false
name = "grpc_tonic"

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["serde"]
