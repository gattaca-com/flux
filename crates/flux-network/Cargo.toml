[package]
edition.workspace = true
keywords = ["communication", "low-latency", "performance"]
license.workspace = true
name = "flux-network"
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
byte-stable.workspace = true
bytes.workspace = true
flux.workspace = true
flux-communication.workspace = true
flux-timing.workspace = true
flux-utils.workspace = true
http.workspace = true
httparse.workspace = true
libc.workspace = true
mio.workspace = true
rustc-hash.workspace = true
rustls = { workspace = true, optional = true }
serde.workspace = true
tracing.workspace = true
webpki-roots = { workspace = true, optional = true }
wincode = { workspace = true, optional = true }

[dev-dependencies]
core_affinity.workspace = true
criterion.workspace = true
hdrhistogram.workspace = true
rcgen.workspace = true
spine-derive.workspace = true
tempfile.workspace = true
# Only for the tonic interop test and the comparison benchmark.
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
wincode = { workspace = true }
wincode-derive = { workspace = true }

[features]
tls = ["dep:rustls", "dep:webpki-roots"]

[[test]]
name = "http_tls"
